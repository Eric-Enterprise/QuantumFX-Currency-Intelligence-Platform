name: Test and build Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Test core and GUI
        shell: pwsh
        run: |
          $env:QUANTUMFX_GUI_TESTS = '1'
          python -m pytest -q
      - name: Build standalone EXE
        shell: pwsh
        run: ./build.ps1
      - name: Test packaged application
        shell: pwsh
        run: |
          $result = Join-Path $PWD 'smoke-result.json'
          $process = Start-Process ./dist/QuantumFX.exe -ArgumentList '--smoke-test', $result -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { throw 'Packaged smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Packaged application failed' }
          if (-not (Get-Content $result | ConvertFrom-Json).ok) { throw 'Packaged smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: QuantumFX-Windows-x64
          path: |
            dist/QuantumFX.exe
            README.md
            LICENSE
